<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гаргантюа — Симуляция Чёрной Дыры</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22black%22 stroke=%22%23ff9933%22 stroke-width=%228%22/></svg>">
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Toggle UI Button -->
  <button id="btn-toggle-ui" title="Скрыть/показать панель">👁 Скрыть интерфейс</button>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Drag and Drop Overlay -->
  <div id="dropzone" class="dropzone">
    <div class="dropzone-box">
      🌌 Перетащите панораму сюда
      <small>Поддерживаются форматы: TIF, TIFF, JPG, PNG, WEBP, AVIF</small>
    </div>
  </div>

  <!-- Overlay UI -->
  <div id="ui-overlay">
    <div class="header">
      <div class="title-badge">Общая теория относительности</div>
      <h1 class="title">ГАРГАНТЮА</h1>
      <p class="subtitle">Сверхмассивная чёрная дыра и гравитационное линзирование</p>

      <div class="controls-hint">
        <span class="mouse-icon">🚀</span>
        <span><strong>WASD</strong> — полёт в космосе • <strong>Зажмите ЛКМ</strong> для обзора 360° • <strong>Shift</strong> — ускорение • <strong>Space / C</strong> — вверх / вниз</span>
      </div>
    </div>

    <div class="controls-panel">
      <button id="btn-reset" class="btn primary" title="Вернуться к точному ракурсу с референса">
        <span>🎥</span> Ракурс из фото
      </button>

      <div class="divider"></div>

      <button id="btn-bloom" class="btn active" title="Включить/выключить свечение">
        <span>✨</span> Свечение
      </button>

      <button id="btn-particles" class="btn active" title="Включить/выключить гравитационно линзируемые искры пыли">
        <span>🌪️</span> Искры пыли
      </button>

      <button id="btn-planet" class="btn active" title="Включить/выключить планету">
        <span>🪐</span> Планета
      </button>

      <!-- Custom background upload button -->
      <button id="btn-upload-bg" class="btn" title="Выбрать любую картинку космоса (панораму) с компьютера">
        <span>🌌</span> Свой фон
      </button>
      <input type="file" id="input-bg-file" accept=".tif,.tiff,.jpg,.jpeg,.png,.webp,.avif,.bmp,image/*" style="display: none;">

      <div class="divider"></div>

      <div class="slider-group">
        <label for="slider-speed">Скорость:</label>
        <input id="slider-speed" type="range" min="0.0" max="2.5" step="0.1" value="0.85">
        <span id="speed-val">0.9x</span>
      </div>

      <div class="divider"></div>

      <button id="btn-audio" class="btn" title="Атмосферный космический звук">
        <span class="icon">🔇</span> Звук космоса
      </button>

      <button id="btn-fullscreen" class="btn" title="Полноэкранный режим">
        <span class="icon">⛶</span> На весь экран
      </button>
    </div>
  </div>

  <script>
    // Toggle UI visibility logic
    const btnToggleUI = document.getElementById('btn-toggle-ui');
    const uiOverlay = document.getElementById('ui-overlay');
    let uiVisible = true;

    btnToggleUI.addEventListener('click', () => {
      uiVisible = !uiVisible;
      uiOverlay.classList.toggle('hidden', !uiVisible);
      btnToggleUI.textContent = uiVisible ? '👁 Скрыть интерфейс' : '👁 Показать интерфейс';
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
